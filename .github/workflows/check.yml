name: Verify local application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: 0.11.1}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: corepack enable
      - run: uv sync --frozen
      - run: uv run ruff check service migrations scripts tests
      - run: uv run pytest -q
      - run: uv run python scripts/bootstrap.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test:e2e
      - run: pnpm --dir web audit --audit-level high
      - run: uv export --frozen --no-dev --no-emit-project --output-file runtime/requirements.txt
      - run: uvx pip-audit -r runtime/requirements.txt --disable-pip --no-deps
      - run: uv run python scripts/secret_scan.py
      - if: always()
        run: docker compose down
