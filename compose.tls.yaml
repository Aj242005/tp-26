services:
  api:
    environment:
      APP_ORIGIN: https://localhost:8443
      OIDC_ISSUER_URL: https://localhost:8443/auth/realms/${OIDC_REALM:-prooflane}
  identity:
    environment:
      KC_HOSTNAME: https://localhost:8443/auth
  gateway:
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./runtime/tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/tls:/etc/local-tls:ro
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, -O, /dev/null, https://127.0.0.1:8443/api/health/live]
