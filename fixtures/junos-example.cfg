# SYNTHETIC: declarative set-style configuration, not a certified benchmark.
set system host-name example-edge-03
set system services ssh protocol-version v2
set system services ssh authentication-retries 3
set system authentication-order radius
set system syslog host 192.0.2.10 any notice
set system syslog time-format year
set system ntp server 192.0.2.20
set system login message "Authorized administrators only"
