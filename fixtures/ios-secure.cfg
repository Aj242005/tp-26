! SYNTHETIC: team-authored example, not a certified baseline.
version 17.9
hostname example-core-01
no ip http server
ip http secure-server
ip ssh version 2
ip ssh time-out 45
ip ssh authentication-retries 3
aaa new-model
username example-admin secret 9 SYNTHETIC_NOT_A_REAL_HASH
logging host 192.0.2.10
service timestamps log datetime msec
login on-success log
login on-failure log
ntp server 192.0.2.20
ntp authenticate
snmp-server group example-audit v3 priv
banner login ^Authorized administrators only^
no ip source-route
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 access-class MANAGEMENT in
line vty 5 15
 transport input ssh
 exec-timeout 10 0
 access-class MANAGEMENT in
end
