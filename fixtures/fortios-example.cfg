# SYNTHETIC: demonstrates scoped FortiOS-style parsing.
config system global
    set hostname "example-firewall-04"
    set admin-ssh-v1 disable
    set admin-ssh-grace-time 45
    set admin-lockout-threshold 3
    set admintimeout 5
end
config system interface
    edit "management"
        set allowaccess ping https ssh
    next
end
