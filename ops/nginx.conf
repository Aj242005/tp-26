worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream auditor { zone auditor 64k; server api:8000 resolve; keepalive 16; }
  upstream identity { zone identity 64k; server identity:8080 resolve; }
  limit_req_zone $binary_remote_addr zone=entry:10m rate=10r/m;
  server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /api/metrics { return 404; }
    location /api/auth/login {
      limit_req zone=entry burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://auditor;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      client_max_body_size 2m;
      proxy_pass http://auditor;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 40s;
      proxy_next_upstream error timeout http_502 http_503;
    }
    location = /api/devices {
      client_max_body_size 100m;
      proxy_pass http://auditor;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 40s;
    }
    location /auth/ {
      proxy_pass http://identity;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port 8185;
      proxy_buffer_size 16k;
      proxy_buffers 4 16k;
    }
    location / {
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
