worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=60s ipv6=off;
  client_max_body_size 2m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 65s;
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  server {
    listen 8081;
    location = /health { return 200 "ready"; }
    location / {
      limit_except GET POST { deny all; }
      set $target aiplatform.googleapis.com;
      proxy_pass https://$target;
      proxy_ssl_name aiplatform.googleapis.com;
      proxy_set_header Host aiplatform.googleapis.com;
    }
  }
  server {
    listen 8082;
    location / {
      limit_except GET POST { deny all; }
      set $target generativelanguage.googleapis.com;
      proxy_pass https://$target;
      proxy_ssl_name generativelanguage.googleapis.com;
      proxy_set_header Host generativelanguage.googleapis.com;
    }
  }
}
