receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 160}
  batch: {}
exporters:
  file:
    path: /tmp/traces.json
    rotation: {max_megabytes: 10, max_backups: 2}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]
